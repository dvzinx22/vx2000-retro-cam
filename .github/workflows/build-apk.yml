name: Build Android APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vx2000-retro-cam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: VX-2000 Retro Cam ${{ github.ref_name }}
          body: |
            ### 📼 VX-2000 Retro Cam ${{ github.ref_name }}
            
            **Novedades de esta versión:**
            - 💾 **Guardado directo en la Galería:** Las fotos y videos capturados ahora se guardan automáticamente en la galería nativa de Android (DCIM / Álbum VX2000) y en Documentos.
            - 💾 **Botón "GUARDAR EN GALERÍA":** En el deck de cintas MiniDV puedes volver a guardar o descargar cualquier clip con un solo toque.
            - 🔔 **Retro HUD Notificaciones:** Cartel OSD en el monitor CRT confirmando cuando un video o foto ha sido guardado.
            - ⚙️ **Ajustes:** Opción en el menú SETUP para activar/desactivar el guardado automático.
          draft: false
          prerelease: false
