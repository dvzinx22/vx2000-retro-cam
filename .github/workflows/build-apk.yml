name: Build Android APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vx2000-retro-cam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: VX-2000 Retro Cam ${{ github.ref_name }}
          body: |
            ### 📼 VX-2000 Retro Cam ${{ github.ref_name }}
            
            **Novedades de esta versión:**
            - ⏱️ **Selector de FPS para Video:** Permite cambiar la cadencia de grabación entre 15 FPS (stop-motion lo-fi), 24 FPS (cine analógico), 30 FPS (NTSC MiniDV) y 60 FPS (skate video fluido).
            - 💾 **Guardado en Galería y Memoria:** Las fotos y videos se guardan directamente en la Galería del teléfono (Álbum VX2000 / DCIM) y en el almacenamiento interno (`Mis Archivos > Documentos > VX2000`).
            - 📺 **Indicador de FPS en OSD:** El visor CRT y la Cassette Deck ahora reflejan los FPS activos (`30p`, `60p`, `15p`).
            - 📖 **Documentación Profesional:** Nuevo README oficial con especificaciones matemáticas de shaders y guías de uso.
          draft: false
          prerelease: false
